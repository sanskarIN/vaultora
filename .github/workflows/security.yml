name: Dependency security

on:
  push:
    branches:
      - main
      - 'continue/**'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '41 4 * * 2'

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Resolve locked dependency graph
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit production and development dependencies
        run: npm audit --audit-level=high

  rustsec:
    name: RustSec audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve Cargo dependency graph
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock
